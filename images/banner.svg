<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Smart Kitchen: cook from what's already in your fridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d33"/>
      <stop offset="1" stop-color="#0b2620"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- fridge outline -->
  <g transform="translate(1010 46)" fill="none" stroke="#5fd3b0" stroke-width="5" stroke-linejoin="round">
    <rect x="0" y="0" width="150" height="228" rx="18"/>
    <line x1="0" y1="84" x2="150" y2="84"/>
    <line x1="124" y1="30" x2="124" y2="62" stroke-linecap="round"/>
    <line x1="124" y1="110" x2="124" y2="160" stroke-linecap="round"/>
  </g>
  <g fill="#5fd3b0" opacity=".35">
    <circle cx="1225" cy="90" r="22"/>
    <circle cx="1230" cy="250" r="14"/>
    <circle cx="960" cy="270" r="10"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="140" fill="#ffffff" font-size="76" font-weight="800">Smart Kitchen</text>
    <text x="74" y="190" fill="#c9eee1" font-size="30">Cook from what's already in your fridge.</text>

    <g font-size="17" font-weight="600" fill="#0b2620">
      <rect x="74" y="226" width="96" height="34" rx="17" fill="#5fd3b0"/>
      <text x="122" y="249" text-anchor="middle">React</text>
      <rect x="182" y="226" width="106" height="34" rx="17" fill="#5fd3b0"/>
      <text x="235" y="249" text-anchor="middle">Express</text>
      <rect x="300" y="226" width="134" height="34" rx="17" fill="#5fd3b0"/>
      <text x="367" y="249" text-anchor="middle">PostgreSQL</text>
      <rect x="446" y="226" width="122" height="34" rx="17" fill="#5fd3b0"/>
      <text x="507" y="249" text-anchor="middle">Firestore</text>
      <rect x="580" y="226" width="104" height="34" rx="17" fill="#5fd3b0"/>
      <text x="632" y="249" text-anchor="middle">Gemini</text>
    </g>
  </g>
</svg>
